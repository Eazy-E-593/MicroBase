<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroBase | Página No Encontrada (404)</title>
    <meta name="description" content="La página o recurso que buscas no existe en MicroBase.">
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/js/lucide.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css?v=1.1.5">
</head>

<body class="dark-theme auth-bg">
    <script>
        if (localStorage.getItem('theme') === 'light') document.body.classList.remove('dark-theme');
        else document.body.classList.add('dark-theme');
    </script>

    <button onclick="toggleTheme()" class="btn btn-secondary"
        style="position: absolute; top: 20px; right: 20px; border-radius: 50%; width: 44px; height: 44px; padding: 0; display: flex; justify-content: center; align-items: center;"
        title="Modo Claro / Oscuro">
        <i data-lucide="moon"></i>
    </button>

    <div class="auth-container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
        <div class="auth-card glass-panel" style="max-width: 520px; text-align: center; padding: 40px 30px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 88px; height: 88px; border-radius: 50%; background: rgba(239, 68, 68, 0.12); border: 2px solid rgba(239, 68, 68, 0.3); margin-bottom: 20px; box-shadow: 0 0 25px rgba(239, 68, 68, 0.2);">
                <i data-lucide="database-zap" style="width: 44px; height: 44px; color: var(--danger);"></i>
            </div>

            <div style="font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--danger); margin-bottom: 8px;">
                Error 404
            </div>

            <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 12px; color: var(--text-main);">
                Recurso No Encontrado
            </h2>

            <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px;">
                La tabla, registro o página a la que intentas acceder no existe, fue eliminada o la dirección es incorrecta.
            </p>

            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <button onclick="history.back()" class="btn btn-secondary" style="display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="arrow-left"></i> Volver Atrás
                </button>
                <a href="/tables-view" class="btn btn-primary" style="display: flex; align-items: center; gap: 8px; text-decoration: none;">
                    <i data-lucide="layout-grid"></i> Ir al Espacio de Trabajo
                </a>
            </div>

            <div style="margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 0.82rem; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px;">
                <i data-lucide="box" style="width: 15px; height: 15px;"></i>
                <span>MicroBase No-Code &bull; Gestión PYMES</span>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js?v=1.0.6"></script>
    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>
</body>

</html>
