<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0cba55" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f2c811" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#0cba55" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="topCapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f2c811" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Glow -->
  <circle cx="64" cy="64" r="32" fill="#0cba55" opacity="0.18" filter="url(#glow)" />

  <!-- Database Stack -->
  <!-- Bottom Disc -->
  <path d="M 32 82 C 32 91, 96 91, 96 82 L 96 94 C 96 103, 32 103, 32 94 Z" fill="url(#primaryGrad)" />
  <!-- Middle Disc -->
  <path d="M 32 58 C 32 67, 96 67, 96 58 L 96 70 C 96 79, 32 79, 32 70 Z" fill="url(#primaryGrad)" />
  <!-- Top Cylinder Body -->
  <path d="M 32 34 C 32 43, 96 43, 96 34 L 96 46 C 96 55, 32 55, 32 46 Z" fill="url(#primaryGrad)" />
  <!-- Top Disc Cap -->
  <ellipse cx="64" cy="34" rx="32" ry="12" fill="url(#topCapGrad)" />

  <!-- Mini Gold Sparkle / No-Code Node (Top Right) -->
  <circle cx="94" cy="30" r="8" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="94" cy="30" r="4" fill="#ffffff" />
</svg>
